spring.application.name=shop
# Өгөгдлийн сангийн холболтын URL (onlineshop гэдгийг өөрийн DB нэрээр соль)
spring.datasource.url=jdbc:mysql://localhost:3306/onlineshop?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
# Нууц мэдээллийг орчны хувьсагчаас, эсвэл git-д ордоггүй application-local.properties файлаас уншина
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# 32+ тэмдэгттэй, санамсаргүй утга. Хоосон бол сервер асах бүрт санамсаргүй түлхүүр үүсгэнэ.
app.jwt.secret=${JWT_SECRET:}
# Сервер асахад энэ хэрэглэгчийг ADMIN болгоно (байхгүй бол үүсгэнэ).
# Жинхэнэ утгыг application-local.properties-д бичнэ (git-д орохгүй).
app.admin.email=admin300@gmail.com
app.admin.password=${admin+1234:}
spring.config.import=optional:classpath:application-local.properties
# Hibernate тохиргоо (Хүснэгтийг автоматаар үүсгэх эсвэл шинэчлэх)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# QPay Merchant API v2. Жинхэнэ утгыг application-local.properties-д бичнэ.
# Хоосон бол QPay демо горимоор ажиллана. Туршилтын орчин: https://merchant-sandbox.qpay.mn
app.qpay.base-url=${QPAY_BASE_URL:https://merchant.qpay.mn}
app.qpay.username=${QPAY_USERNAME:}
app.qpay.password=${QPAY_PASSWORD:}
app.qpay.invoice-code=${QPAY_INVOICE_CODE:}
# Интернэтээс хандах боломжтой backend хаяг + /api/qpay/callback (жишээ: https://shop.mn/api/qpay/callback)
app.qpay.callback-url=${QPAY_CALLBACK_URL:}

# Хүргэлтийн төлбөр (төгрөг)
app.delivery.ulaanbaatar=7000
app.delivery.rural=7000

# Админы оруулсан зургийн хавтас (next-app/uploads). Mobile апп GET /uploads/<нэр>-ээр татна.
# Жинхэнэ замыг application-local.properties-д бичнэ. Хоосон бол backend зураг үйлчлэхгүй.
app.upload-dir=${UPLOAD_DIR:}

# Захиалгын и-мэйл (Gmail). Жинхэнэ утгыг application-local.properties-д бичнэ. Хоосон бол и-мэйл илгээхгүй.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Frontend-ийн хаяг. Нууц үг сэргээх и-мэйл дэх холбоос үүнээс үүснэ (жишээ: https://sportshop.mn)
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
# Backend-ийг шууд дуудах эрхтэй frontend хаягууд, таслалаар (жишээ: https://sportshop.mn,https://www.sportshop.mn)
app.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
